services:
  - type: web
    name: studio-cafe
    runtime: php
    plan: free
    buildCommand: composer install --no-dev && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: studio-cafe-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studio-cafe-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: studio-cafe-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: studio-cafe-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: studio-cafe-db
          property: password

databases:
  - name: studio-cafe-db
    plan: free
    databaseName: studio_cafe
